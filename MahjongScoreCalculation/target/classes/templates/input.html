<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>麻雀 点数入力</title>

<style>
    body {
        font-family: "Meiryo", sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 15px;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
        font-size: 30px;
    }

    .card {
        background: #fff;
        padding: 12px;
        margin: 0 auto 10px auto;
        max-width: 550px;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .section-title {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #444;
        border-left: 4px solid #4CAF50;
        padding-left: 8px;
    }

    .radio-group label {
        margin-right: 10px;
        font-size: 14px;
    }

    input[type="number"] {
        width: 60px;
        padding: 4px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }
	
	.fu-result {
	    font-size: 15px;
	    font-weight: bold;
	    margin-bottom: 6px;
	    color: #444;
	    border-left: 4px solid #4CAF50;
	    padding-left: 8px;
	}

    .submit-btn {
        display: block;
        width: 100%;
        padding: 10px;
        background: #4CAF50;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
    }

    .submit-btn:hover {
        background: #45a049;
    }
</style>

</head>
<body>

<h1>麻雀 点数計算</h1>

<form action="/score" method="post">

    <div class="card">
        <div class="section-title">自家</div>
        <div class="radio-group">
            <label><input type="radio" name="jicha" value="親" checked> 親</label>
            <label><input type="radio" name="jicha" value="子"> 子</label>
        </div>
    </div>

    <div class="card">
        <div class="section-title">本場・翻</div>
        本場 <input type="number" name="honba" value="1" min="0" max="10">
        翻 <input type="number" name="han" value="1" min="1" max="13">
    </div>

    <div class="card">
        <div class="section-title">アガリ</div>
        <div class="radio-group">
            <label><input type="radio" name="agari" value="ピンフ・ツモ"> ピンフ・ツモ(20)</label>
            <label><input type="radio" name="agari" value="鳴きピンフ・ロン"> 鳴きピンフ(30)</label>
            <label><input type="radio" name="agari" value="七対子"> 七対子(25)</label>
            <label><input type="radio" name="agari" value="その他" checked> その他</label>
        </div>
    </div>

    <div class="card">
        <div class="section-title">アガリ方</div>
        <div class="radio-group">
            <label><input type="radio" name="agarikata" value="ツモ" checked> ツモ+2</label>
            <label><input type="radio" name="agarikata" value="門前・ロン"> 門前ロン+10</label>
        </div>
    </div>

    <div class="card">
        <div class="section-title">待ち</div>
        <div class="radio-group">
            <label><input type="radio" name="machi" value="両面" checked> 両面+0</label>
            <label><input type="radio" name="machi" value="シャボ"> シャボ+0</label>
            <label><input type="radio" name="machi" value="ペンチャン"> ペンチャン+2</label>
            <label><input type="radio" name="machi" value="カンチャン"> カンチャン+2</label>
            <label><input type="radio" name="machi" value="単騎"> 単騎+2</label>
        </div>
    </div>

    <div class="card">
        <div class="section-title">雀頭</div>
        <div class="radio-group">
            <label><input type="radio" name="janto" value="役牌">役牌+2</label>
            <label><input type="radio" name="janto" value="役牌(ダブトン・ダブナン)"> ダブ牌+4</label>
            <label><input type="radio" name="janto" value="その他" checked> その他+0</label>
        </div>
    </div>

    <div class="card">
        <div class="section-title">面子（刻子・槓子）</div>
        明刻(中)+2 <input type="number" name="minko_chunchanpai" value="0" min="0" max="4">
        明刻(么)+4 <input type="number" name="minko_yaochūhai" value="0" min="0" max="4"><br>
        暗刻(中)+4 <input type="number" name="anko_chunchanpai" value="0" min="0" max="4">
        暗刻(么)+8 <input type="number" name="anko_yaochūhai" value="0" min="0" max="4"><br>
        明槓(中)+8 <input type="number" name="minkan_chunchanpai" value="0" min="0" max="4">
        明槓(么)+16<input type="number" name="minkan_yaochūhai" value="0" min="0" max="4"><br>
        暗槓(中)+16<input type="number" name="ankan_chunchanpai" value="0" min="0" max="4">
        暗槓(么)+32<input type="number" name="ankan_yaochūhai" value="0" min="0" max="4">
    </div>
	
	<div class="card">
		<div class="fu-result" id="fu-result" style="font-size: 20px; font-weight: bold; margin-top: 20px;"></div>
	</div>
	
	<!-- JSはここに置くのがベスト -->
	<script src="/js/fu.js"></script>

	
	
    <button class="submit-btn" type="submit">点数計算する</button>

</form>

</body>
</html>
